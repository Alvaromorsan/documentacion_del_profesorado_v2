<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Instrucciones - IES Doctora Josefa de los Reyes</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-hover: #1d4ed8;
      
      --success-bg: #dcfce7;
      --success-text: #15803d;

      --role-badge-bg: #e0e7ff;
      --role-badge-text: #3730a3;
      
      --date-badge-bg: #fef3c7;
      --date-badge-text: #92400e;
      
      --border-color: #e2e8f0;
      --radius: 14px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      line-height: 1.6;
    }

    .app-container {
      max-width: 940px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: white;
      padding: 26px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      text-align: center;
    }

    .header-logo {
      max-height: 75px;
      width: auto;
      object-fit: contain;
      background-color: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: 10px;
    }

    .header-text {
      flex: 1;
      min-width: 250px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 0.98rem;
      font-weight: 400;
    }

    .roles-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .roles-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .grid-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .btn-rol {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-rol:hover {
      background-color: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    .btn-rol.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .bar-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-sync {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.88rem;
      padding: 8px 12px;
      border-radius: 8px;
      background-color: white;
      transition: all 0.2s ease;
    }

    .btn-sync:hover {
      background-color: var(--primary-soft);
      border-color: var(--primary);
    }

    .tarea-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--primary);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      position: relative;
    }

    .tarea-card.completada {
      opacity: 0.75;
      border-left-color: #10b981;
      background-color: #f8fafc;
    }

    .tarea-card.con-retraso:not(.completada) {
      border-left-color: #dc2626;
    }

    /* EFECTO SIRENA DE POLICÍA PARA TAREAS CADUCADAS */
    @keyframes sirenaPolicia {
      0%, 100% {
        background-color: #dc2626;
        color: #ffffff;
        border-color: #991b1b;
        box-shadow: 0 0 10px rgba(220, 38, 38, 0.65);
      }
      50% {
        background-color: #2563eb;
        color: #ffffff;
        border-color: #1e40af;
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.65);
      }
    }

    .alerta-retraso {
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      animation: sirenaPolicia 0.9s infinite ease-in-out;
    }

    .tarea-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 12px;
    }

    .tarea-titulo {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.35;
    }

    .tarea-card.completada .tarea-titulo {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-completar {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .btn-completar:hover {
      border-color: #10b981;
      color: #10b981;
      background-color: #f0fdf4;
    }

    .tarea-card.completada .btn-completar {
      background-color: var(--success-bg);
      color: var(--success-text);
      border-color: #a7f3d0;
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .badge-rol {
      background-color: var(--role-badge-bg);
      color: var(--role-badge-text);
    }

    .badge-fecha {
      background-color: var(--date-badge-bg);
      color: var(--date-badge-text);
      transition: all 0.3s ease;
    }

    .badge-fecha.caducada:not(.completada-badge) {
      animation: sirenaPolicia 0.9s infinite ease-in-out;
      border: 1px solid transparent;
    }

    /* ESTILOS PARA LA COLUMNA E (MODO VISUALIZACIÓN HTML) */
    .instrucciones-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 22px;
      font-size: 0.98rem;
      color: #334155;
      line-height: 1.65;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* Formatos HTML contenidos en la columna E */
    .instrucciones-box p {
      margin: 0 0 12px 0;
    }

    .instrucciones-box p:last-child {
      margin-bottom: 0;
    }

    .instrucciones-box ul, 
    .instrucciones-box ol {
      margin: 10px 0 14px 0;
      padding-left: 24px;
    }

    .instrucciones-box li {
      margin-bottom: 6px;
    }

    .instrucciones-box a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .instrucciones-box a:hover {
      color: var(--primary-hover);
    }

    .instrucciones-box h1, 
    .instrucciones-box h2, 
    .instrucciones-box h3, 
    .instrucciones-box h4 {
      color: #1e293b;
      margin: 16px 0 8px 0;
      font-weight: 700;
      line-height: 1.3;
    }

    .instrucciones-box h1 { font-size: 1.25rem; }
    .instrucciones-box h2 { font-size: 1.15rem; }
    .instrucciones-box h3 { font-size: 1.05rem; }

    .instrucciones-box blockquote {
      border-left: 4px solid var(--primary);
      background-color: var(--primary-soft);
      margin: 14px 0;
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      color: #1e3a8a;
      font-style: italic;
    }

    .instrucciones-box table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 0.9rem;
    }

    .instrucciones-box th, 
    .instrucciones-box td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }

    .instrucciones-box th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #1e293b;
    }

    .instrucciones-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
      box-shadow: var(--shadow-sm);
    }

    .instrucciones-box code {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }

    .state-box {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
    }

    .state-box h3 {
      margin: 0 0 6px 0;
      color: var(--text-main);
    }

    .contador-badge {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <img src="logo.png" alt="Logo IES Doctora Josefa de los Reyes" class="header-logo" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>IES Doctora Josefa de los Reyes</h1>
      <p>Asistente virtual del profesorado para la entrega de documentación</p>
    </div>
  </header>

  <div class="roles-section">
    <div class="roles-section-title">SELECCIONA TU ROL DOCENTE:</div>
    <div class="grid-roles">
      <button class="btn-rol" onclick="filtrarRol('Profesor (ESO)', this)">📋 Profesor (ESO)</button>
      <button class="btn-rol" onclick="filtrarRol('Profesor (FP)', this)">📋 Profesor (FP)</button>
      <button class="btn-rol" onclick="filtrarRol('Jefe de Departamento', this)">📋 Jefe de Departamento</button>
      <button class="btn-rol" onclick="filtrarRol('Tutor (ESO)', this)">📋 Tutor (ESO)</button>
      <button class="btn-rol" onclick="filtrarRol('Tutor (FP)', this)">📋 Tutor (FP)</button>
      <button class="btn-rol" onclick="filtrarRol('Orientador', this)">📋 Orientador</button>
      <button class="btn-rol" onclick="filtrarRol('Jefe del DACE', this)">📋 Jefe del DACE</button>
    </div>
  </div>

  <div class="controls-bar">
    <div class="search-box">
      <input type="text" id="input-buscar" placeholder="🔍 Buscar por palabra clave en instrucciones o tareas..." oninput="filtrarActual()">
    </div>
    <div class="bar-status">
      <span id="txt-status">⏳ Sincronizando...</span>
      <button class="btn-sync" onclick="cargarDatos()">🔄 Sincronizar</button>
    </div>
  </div>

  <div id="contenedor-tareas">
    <div class="state-box">
      <h3>Ningún rol seleccionado</h3>
      <p>Haz clic en cualquiera de los botones de arriba para visualizar los plazos e instrucciones.</p>
    </div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTw-joIwxwmIL6BGsYebAw4X6iI9nxk5DijWImHsYEeG_WT_GGdt1BgCeNkp03ll0K-t9JGzly5ivdc/pub?gid=0&single=true&output=csv';

  let datosCSV = [];
  let rolSeleccionado = '';
  // Guardado local para mantener el estado de tareas completadas
  let tareasCompletadas = JSON.parse(localStorage.getItem('tareas_completadas_ies') || '{}');

  function normalizar(texto) {
    return texto ? String(texto).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : '';
  }

  async function cargarDatos() {
    const status = document.getElementById('txt-status');
    status.innerText = '⏳ Sincronizando datos...';

    try {
      const response = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime());
      if (!response.ok) throw new Error('Error de comunicación');
      const text = await response.text();
      datosCSV = parseCSV(text);
      status.innerText = '✅ Datos actualizados.';

      if (rolSeleccionado) {
        const btn = Array.from(document.querySelectorAll('.btn-rol')).find(b => b.innerText.includes(rolSeleccionado));
        filtrarRol(rolSeleccionado, btn);
      }
    } catch (e) {
      status.innerText = '⚠️ Error al cargar datos.';
    }
  }

  function parseCSV(text) {
    if (!text) return [];
    let rows = [];
    let currentRow = [];
    let currentVal = '';
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      let c = text[i];
      let nextC = text[i+1];

      if (c === '"') {
        if (insideQuotes && nextC === '"') {
          currentVal += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (c === ',' && !insideQuotes) {
        currentRow.push(currentVal.trim());
        currentVal = '';
      } else if ((c === '\r' || c === '\n') && !insideQuotes) {
        if (c === '\r' && nextC === '\n') { i++; }
        currentRow.push(currentVal.trim());
        if (currentRow.length > 0 && currentRow.some(cell => cell !== '')) {
          rows.push(currentRow);
        }
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += c;
      }
    }
    if (currentVal || currentRow.length > 0) {
      currentRow.push(currentVal.trim());
      if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
    }

    if (rows.length === 0) return [];

    let headers = rows[0].map(h => h.replace(/^"|"$/g, '').trim());
    let result = [];

    for (let i = 1; i < rows.length; i++) {
      let obj = {};
      headers.forEach((header, index) => {
        let val = rows[i][index] !== undefined ? rows[i][index].replace(/^"|"$/g, '').trim() : '';
        obj[header] = val;
      });

      // Mapeo explicito por columna si varia el nombre del encabezado (A, B, C, D, E)
      obj['_colA'] = rows[i][0] !== undefined ? rows[i][0].replace(/^"|"$/g, '').trim() : '';
      obj['_colB'] = rows[i][1] !== undefined ? rows[i][1].replace(/^"|"$/g, '').trim() : '';
      obj['_colC'] = rows[i][2] !== undefined ? rows[i][2].replace(/^"|"$/g, '').trim() : '';
      obj['_colD'] = rows[i][3] !== undefined ? rows[i][3].replace(/^"|"$/g, '').trim() : '';
      obj['_colE'] = rows[i][4] !== undefined ? rows[i][4].replace(/^"|"$/g, '').trim() : ''; // COLUMNA E: Instrucciones (HTML)

      result.push(obj);
    }
    return result;
  }

  // Convierte URLs planas en enlaces cliquables si la cadena no viene ya en formato HTML
  function autoLinkify(texto) {
    if (!texto) return '';
    const regex = /(https?:\/\/[^\s<]+)/g;
    return String(texto).replace(regex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  }

  // Función principal para procesar el HTML de la Columna E
  function procesarContenidoColumnaE(textoColumnaE) {
    if (!textoColumnaE) {
      return '<p><em>Sin instrucciones detalladas.</em></p>';
    }

    // Detectar si el texto contiene etiquetas HTML (ej. <p>, <ul>, <b>, <a>, <table>, etc.)
    const tieneHTML = /<[a-z][\s\S]*>/i.test(textoColumnaE);

    if (tieneHTML) {
      // Es HTML nativo: lo insertamos directamente para que el navegador renderice la vista
      return textoColumnaE;
    } else {
      // Es texto plano: aplicamos autovínculos y conversión de saltos de línea
      let formateado = autoLinkify(textoColumnaE);
      formateado = formateado.replace(/\r\n|\r|\n/g, '<br>');
      return `<p>${formateado}</p>`;
    }
  }

  function parseFecha(fechaStr) {
    if (!fechaStr) return null;
    const str = normalizar(fechaStr);
    if (str.includes('sin fecha') || str === '') return null;

    try {
      const meses = {
        'enero': 0, 'febrero': 1, 'marzo': 2, 'abril': 3, 'mayo': 4, 'junio': 5,
        'julio': 6, 'agosto': 7, 'septiembre': 8, 'setiembre': 8, 'octubre': 9,
        'noviembre': 10, 'diciembre': 11
      };

      for (let mesNom in meses) {
        if (str.includes(mesNom)) {
          const numMatch = str.match(/\b(\d{1,2})\b/);
          if (numMatch) {
            let dia = parseInt(numMatch[1], 10);
            let mes = meses[mesNom];
            const anioMatch = str.match(/\b(20\d{2})\b/);
            let hoy = new Date();
            let anio = anioMatch ? parseInt(anioMatch[1], 10) : hoy.getFullYear();
            let d = new Date(anio, mes, dia);
            if (!isNaN(d.getTime())) return d;
          }
        }
      }

      let partes = str.split(/[\/-]/);
      if (partes.length === 3) {
        let p1 = parseInt(partes[0], 10);
        let p2 = parseInt(partes[1], 10);
        let p3 = parseInt(partes[2], 10);
        if (!isNaN(p1) && !isNaN(p2) && !isNaN(p3)) {
          let d = null;
          if (p1 > 1000) {
            d = new Date(p1, p2 - 1, p3);
          } else {
            if (p3 < 100) p3 += 2000;
            d = new Date(p3, p2 - 1, p1);
          }
          if (d && !isNaN(d.getTime())) return d;
        }
      }
    } catch (e) {}

    return null;
  }

  function toggleCompletada(idTarea) {
    tareasCompletadas[idTarea] = !tareasCompletadas[idTarea];
    localStorage.setItem('tareas_completadas_ies', JSON.stringify(tareasCompletadas));
    filtrarActual();
  }

  function filtrarActual() {
    const btnActivo = document.querySelector('.btn-rol.active');
    if (rolSeleccionado && btnActivo) {
      filtrarRol(rolSeleccionado, btnActivo);
    }
  }

  function filtrarRol(nombreRol, elementoBoton) {
    try {
      rolSeleccionado = nombreRol;

      document.querySelectorAll('.btn-rol').forEach(b => b.classList.remove('active'));
      if (elementoBoton) elementoBoton.classList.add('active');

      const contenedor = document.getElementById('contenedor-tareas');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      const busqueda = normalizar(document.getElementById('input-buscar').value);

      const hoy = new Date();
      hoy.setHours(0,0,0,0);

      const rolBuscado = normalizar(nombreRol);

      let tareas = datosCSV.filter(f => {
        const keyMostrar = Object.keys(f).find(k => normalizar(k) === 'mostrar') || '_colD';
        const keyRol = Object.keys(f).find(k => normalizar(k) === 'rol') || '_colB';

        const valMostrar = normalizar(f[keyMostrar]);
        const valRol = normalizar(f[keyRol]);

        const estaActivo = valMostrar.startsWith('s');
        const coincideRol = valRol.includes(rolBuscado);

        if (!estaActivo || !coincideRol) return false;

        if (busqueda) {
          const keyAccion = Object.keys(f).find(k => normalizar(k) === 'accion') || '_colA';
          const keyInstruccion = Object.keys(f).find(k => normalizar(k) === 'instruccion' || normalizar(k) === 'instrucciones') || '_colE';
          
          const txtAccion = normalizar(f[keyAccion]);
          const txtInstruccion = normalizar(f[keyInstruccion] || f['_colE']);
          
          return txtAccion.includes(busqueda) || txtInstruccion.includes(busqueda);
        }

        return true;
      });

      if (tareas.length === 0) {
        contenedor.innerHTML = `
          <div class="state-box">
            <h3>No se encontraron tareas</h3>
            <p>No hay tareas pendientes visibles para <strong>${nombreRol}</strong> ${busqueda ? 'que coincidan con la búsqueda' : ''}.</p>
          </div>`;
        return;
      }

      tareas = tareas.map(t => {
        const keyFecha = Object.keys(t).find(k => normalizar(k) === 'fecha') || '_colC';
        return {
          ...t,
          _fechaObj: parseFecha(t[keyFecha] || t['_colC'])
        };
      });

      // Ordenar por fecha límite (próximas fechas primero)
      tareas.sort((a, b) => {
        if (!a._fechaObj && !b._fechaObj) return 0;
        if (!a._fechaObj) return 1;
        if (!b._fechaObj) return -1;
        return a._fechaObj.getTime() - b._fechaObj.getTime();
      });

      tareas.forEach((t, index) => {
        const keyAccion = Object.keys(t).find(k => normalizar(k) === 'accion') || '_colA';
        const keyFecha = Object.keys(t).find(k => normalizar(k) === 'fecha') || '_colC';
        const keyInstruccion = Object.keys(t).find(k => normalizar(k) === 'instruccion' || normalizar(k) === 'instrucciones') || '_colE';
        const keyRol = Object.keys(t).find(k => normalizar(k) === 'rol') || '_colB';

        const titulo = t[keyAccion] || t['_colA'] || 'Sin título';
        const fechaTexto = t[keyFecha] || t['_colC'] || 'Sin fecha';
        const rolTexto = t[keyRol] || t['_colB'] || nombreRol;
        
        // Obtención directa del contenido HTML en Columna E
        const contenidoColumnaE = t[keyInstruccion] !== undefined ? t[keyInstruccion] : t['_colE'];

        let esRetraso = false;
        if (t._fechaObj && t._fechaObj.getTime() < hoy.getTime()) {
          esRetraso = true;
        }

        const idTarea = normalizar(nombreRol + '_' + titulo + '_' + fechaTexto);
        const estaCompletada = !!tareasCompletadas[idTarea];

        // Procesar HTML de la Columna E en modo visualización
        const htmlInstrucciones = procesarContenidoColumnaE(contenidoColumnaE);

        let htmlCard = `
          <div class="tarea-card ${esRetraso ? 'con-retraso' : ''} ${estaCompletada ? 'completada' : ''}">
            ${esRetraso && !estaCompletada ? '<div class="alerta-retraso">⚠️ ¡ATENCIÓN! ¡La fecha de entrega ya ha pasado!</div>' : ''}
            
            <div class="tarea-header">
              <h2 class="tarea-titulo">📌 ${titulo}</h2>
              <button class="btn-completar" onclick="toggleCompletada('${idTarea}')">
                ${estaCompletada ? '✅ Completada' : '⬜ Marcar hecha'}
              </button>
            </div>
            
            <div class="meta-badges">
              <span class="badge badge-rol">👤 ${rolTexto}</span>
              <span class="badge badge-fecha ${esRetraso ? 'caducada' : ''} ${estaCompletada ? 'completada-badge' : ''}">
                📅 Fecha límite: ${fechaTexto}
              </span>
            </div>

            <!-- VISUALIZACIÓN EN MODO HTML DE LA COLUMNA E -->
            <div class="instrucciones-box">
              ${htmlInstrucciones}
            </div>
          </div>
        `;
        contenedor.innerHTML += htmlCard;
      });
    } catch (err) {
      console.error(err);
    }
  }

  // Carga inicial
  cargarDatos();
</script>

</body>
</html>
